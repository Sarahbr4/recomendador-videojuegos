let qi=0, ans={};
function save(){localStorage.setItem('myGames',JSON.stringify(games))}
function escape(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const COVER_CACHE_KEY='gameCoverCacheV1';
let coverCache={};
try{coverCache=JSON.parse(localStorage.getItem(COVER_CACHE_KEY)||'{}')||{}}catch(e){coverCache={}}
function saveCoverCache(){try{localStorage.setItem(COVER_CACHE_KEY,JSON.stringify(coverCache))}catch(e){}}
function coverKey(title){return title.toLowerCase().trim()}
async function findCover(title){
 const key=coverKey(title);
 if(Object.prototype.hasOwnProperty.call(coverCache,key)) return coverCache[key];
 const clean=title.replace(/\b(1|2|3)\b/g,'').replace(/season [12]/ig,'').trim();
 const urls=[
  'https://es.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(clean+' videojuego')+'&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=500&format=json&origin=*',
  'https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(clean+' video game')+'&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=500&format=json&origin=*'
 ];
 for(const url of urls){
  try{
   const r=await fetch(url); if(!r.ok) continue;
   const d=await r.json(); const pages=d.query&&d.query.pages?Object.values(d.query.pages):[];
   const img=pages[0]&&pages[0].thumbnail&&pages[0].thumbnail.source;
   if(img){coverCache[key]=img;saveCoverCache();return img}
  }catch(e){}
 }
 coverCache[key]='';saveCoverCache();return '';
}
function attachCovers(root=document){
 const imgs=[...root.querySelectorAll('img[data-cover]')];
 if(!imgs.length)return;
 const load=async img=>{
  const title=img.dataset.cover;
  const url=await findCover(title);
  if(url){img.src=url;img.style.display='block';img.closest('.cover-wrap')?.classList.remove('cover-placeholder-wrap')}
  else {img.style.display='none';const ph=img.parentElement; if(ph) ph.innerHTML='<div class=\"cover-placeholder\">🎮</div>';}
 };
 if('IntersectionObserver' in window){
  const io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);load(e.target)}})},{rootMargin:'250px'});
  imgs.forEach(i=>io.observe(i));
 }else imgs.forEach(load);
}
function init(){
 $('#total').textContent=games.length+' juegos';
 const ps=[...new Set(games.map(g=>g.platform))].sort();
 $('#platform').innerHTML='<option value="">Todas las plataformas</option>'+ps.map(p=>`<option>${escape(p)}</option>`).join('');
 $('#newPlatform').innerHTML=ps.map(p=>`<option>${escape(p)}</option>`).join('')+'<option>Otra</option>';
 renderLibrary();
}
function showPage(p){
 Object.values(pages).forEach(x=>x.classList.add('hidden'));pages[p].classList.remove('hidden');
 $$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 if(p==='library')renderLibrary();
}
$$('.tab').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
$('#start').onclick=()=>{qi=0;ans={};$('#results').classList.add('hidden');$('#quiz').classList.remove('hidden');showQuestion()}
function showQuestion(){
 const x=questions[qi];$('#progress').textContent=`Pregunta ${qi+1} de ${questions.length}`;
 $('#q').textContent=x.q;$('#answers').innerHTML=x.a.map(v=>`<button class="answer" data-v="${escape(v)}">${escape(v)}</button>`).join('');
 $$('.answer').forEach(b=>b.onclick=()=>{ans[x.key]=b.dataset.v;qi++;if(qi<questions.length)showQuestion();else recommend()})
}

function score(g){
 let t=g.title.toLowerCase(),s=0,why=[];
 function hit(list,pts,label){if((list||[]).some(k=>t.includes(k))){s+=pts;if(label&&!why.includes(label))why.push(label)}}
 if(ans.genre&&ans.genre!=='Me da igual')hit(rules.genre[ans.genre],5,ans.genre);
 if(ans.mood&&ans.mood!=='Me da igual')hit(rules.mood[ans.mood],4,ans.mood);
 if(ans.players==='Con 1 persona')hit(['it takes two','portal 2','stardew','minecraft','overcooked','phasmophobia','lethal company','we were here','keywe','human fall flat','supermarket together','bokura','unrailed'],4,'2 jugadores');
 if(ans.players==='Con varias personas')hit(['minecraft','among us','phasmophobia','lethal company','overcooked','jackbox','rocket league','fortnite','marvel rivals','party','unrailed','payday','left 4 dead','deep rock','squad'],4,'multijugador');
 if(ans.players==='Solo')hit(['firewatch','stardew','hades','dead cells','hollow knight','control','red dead','uncharted','tomb raider','detroit','fallout','cyberpunk'],2,'para jugar solo');
 if(ans.pace==='Intenso')hit(['doom','ghostrunner','sifu','hades','dead cells','hot wheels','rocket league','fortnite','tekken','mortal kombat','chivalry','hell let loose','killing floor'],2,'ritmo intenso');
 if(ans.pace==='Tranquilo')hit(['stardew','animal crossing','tiny glade','cozy grove','kamaeru','firewatch','house flipper','powerwash','botanicula'],2,'ritmo tranquilo');
 return {s,why};
}
function recommend(){
 $('#quiz').classList.add('hidden');
 let ranked=games.map(g=>({...g,...score(g)})).sort((a,b)=>b.s-a.s || a.title.localeCompare(b.title));
 let top=ranked.slice(0,3);
 $('#results').classList.remove('hidden');
 $('#results').innerHTML='<div class="panel"><div class="small">RESULTADO</div><h2>🎯 Estas son mis 3 opciones para ti</h2><div class="grid" style="margin-top:13px">'+top.map((g,i)=>`<div class="result"><div class="cover-wrap cover-placeholder-wrap"><img class="cover" data-cover="${escape(g.title)}" alt="Carátula de ${escape(g.title)}" loading="lazy" style="display:block"><div class="cover-placeholder">🎮</div></div><div class="rank">#${i+1} · ${escape(g.platform)}</div><h3 style="margin:5px 0">${escape(g.title)}</h3><div class="why">${g.why.length?'Encaja por: '+escape(g.why.join(' · ')):'Es una opción de tu biblioteca que puede encajar con la combinación de respuestas.'}</div></div>`).join('')+'</div><div class="small" style="margin-top:12px">Las carátulas se buscan automáticamente y pueden tardar unos segundos la primera vez.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="primary" onclick="document.getElementById(\'start\').click()">Otra recomendación</button><button class="secondary" onclick="showPage(\'library\')">Ver biblioteca</button></div></div>';attachCovers($('#results'));
}
function renderLibrary(){
 let q=$('#search').value.toLowerCase(),p=$('#platform').value;
 let list=games.filter(g=>(!q||g.title.toLowerCase().includes(q))&&(!p||g.platform===p));
 $('#libraryGrid').innerHTML=list.map(g=>`<div class="game"><div class="cover-wrap cover-placeholder-wrap"><img class="cover" data-cover="${escape(g.title)}" alt="Carátula de ${escape(g.title)}" loading="lazy" style="display:block"><div class="cover-placeholder">🎮</div></div><div class="game-info"><b>${escape(g.title)}</b><span class="tag">${escape(g.platform)}</span></div></div>`).join('') || '<div class="muted">No hay juegos que coincidan.</div>'; attachCovers($('#libraryGrid'));
}
$('#search').oninput=renderLibrary;$('#platform').onchange=renderLibrary;
$('#saveGames').onclick=()=>{
 let names=$('#newTitles').value.split(/\n/).map(x=>x.trim()).filter(Boolean),p=$('#newPlatform').value;
 let existing=new Set(games.map(g=>g.platform.toLowerCase()+'|'+g.title.toLowerCase()));
 let added=0; for(const title of names){let k=p.toLowerCase()+'|'+title.toLowerCase();if(!existing.has(k)){games.push({title,platform:p});existing.add(k);added++}}
 save();init();$('#newTitles').value='';$('#savedMsg').textContent=`Añadidos ${added} juego${added===1?'':'s'}.`;
};
init();
